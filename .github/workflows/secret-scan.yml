# secret-scan (2026-10-20): gitleaks over every pushed commit and every PR, so a key that slips into git is caught
# within minutes. Output is redacted; a hit turns the check red. Rotate the key first, then remove it.
# Verified false positives go in .gitleaks.toml (allowlist). Same workflow as gweeyichen/brain-deals.
name: secret-scan
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          V=8.21.2
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz
          curl -sSL -o sums.txt https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_checksums.txt
          grep linux_x64 sums.txt | awk '{print $1"  gl.tgz"}' | sha256sum -c -
          tar xzf gl.tgz gitleaks
      - name: Scan the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          START="$BASE"
          [ -z "$START" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && START="$BEFORE"
          if [ -n "$START" ] && ! git cat-file -e "$START^{commit}" 2>/dev/null; then
            git fetch -q --depth=100 origin "$START" 2>/dev/null || true
          fi
          if [ -n "$START" ] && git cat-file -e "$START^{commit}" 2>/dev/null; then RANGE="$START..HEAD"; else RANGE="HEAD~1..HEAD"; fi
          echo "scanning $RANGE"
          CFG=""; [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          ./gitleaks git --redact --no-banner $CFG --log-opts="$RANGE" .
